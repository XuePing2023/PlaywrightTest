name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Must run before setup-node, which shells out to pnpm to resolve its cache path.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      # Hard-fails if package.json and pnpm-lock.yaml disagree.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keep this in sync with the `projects` list in playwright.config.ts.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Builds and serves the app via the `webServer` block in playwright.config.ts.
      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      # Flat, readable PNGs — one per test step — for quick offline review.
      - name: Upload step screenshots
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: step-screenshots
          path: test-results/**/*.png
          retention-days: 14
          if-no-files-found: ignore

      # Raw traces, screenshots and videos, which the report may only link to.
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
